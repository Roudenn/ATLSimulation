- type: entity
  save: false
  id: MobObserver
  name: observer
  description: Default camera entity that has a player attached to it.
  components:
  - type: Sprite
    texture: /Textures/weh.png
  - type: Physics
    bodyType: KinematicController
    ignoreGravity: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
  - type: InputMover
  - type: LagCompensation
  - type: Input
    context: "common"
  - type: Eye
    drawFov: false
  - type: ContentEye
    maxZoom: 2,2
  - type: Observer
