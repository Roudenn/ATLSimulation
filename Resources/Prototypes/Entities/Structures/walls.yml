- type: entity
  abstract: true
  id: BaseWall
  name: basewall
  description: Keeps the air in and the greytide out.
  placement:
    mode: SnapgridCenter
    snap:
      - Wall
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Sprite
    drawdepth: Walls
  - type: Appearance
  - type: IconSmooth
    key: walls
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Occluder
  - type: Airtight
  - type: HeatContainer
  - type: Material

  #- type: Tag
  #  tags:
  #  - Wall

# Carbon steel
- type: entity
  parent: BaseWall
  id: WallReinforced
  name: carbon steel wall
  components:
  - type: Sprite
    sprite: Structures/Walls/solid.rsi
  - type: IconSmooth
    base: reinf_over
  - type: Material
    material: CarbonSteel

- type: entity
  parent: WallReinforced
  id: WallReinforcedHot
  suffix: Hot, 100 Celsius
  components:
  - type: HeatContainer
    startingTemperature: 373.15

- type: entity
  parent: WallReinforced
  id: WallReinforcedSuperHot
  suffix: Super hot, 1000 Celsius
  components:
  - type: HeatContainer
    startingTemperature: 1273.15

- type: entity
  parent: WallReinforced
  id: WallReinforcedCold
  suffix: Cold, -100 Celsius
  components:
  - type: HeatContainer
    startingTemperature: 173.15

